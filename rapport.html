<!DOCTYPE html>
<html>
<head>
    <title>Marcher-Direct Rapport</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 20px; background: #f2f2f2; }
        .box { background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 500px; margin: auto; }
        input, textarea { width: 80%; padding: 10px; margin: 8px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 12px 25px; background: #25D366; color: white; border: none; border-radius: 5px; font-size: 16px; margin-top: 10px; }
        label { font-weight: bold; display: block; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Marcher-Direct</h1>
        <h2>Déposer un Rapport</h2>
        
        <label>Date du jour</label>
        <input type="date" id="date">
        
        <label>Ventes du jour (FC)</label>
        <input type="number" id="ventes" placeholder="Ex: 50000">
        
        <label>Dépenses du jour (FC)</label>
        <input type="number" id="depenses" placeholder="Ex: 20000">
        
        <label>Commentaires</label>
        <textarea id="commentaire" placeholder="Qu'est-ce qui s'est bien passé aujourd'hui?"></textarea>
        
        <button onclick="envoyerRapport()">Envoyer le rapport</button>
        <br><br>
        <a href="index.html">Retour Connexion</a>
    </div>

<script>
function envoyerRapport(){
    alert("Rapport envoyé ! \\n\\nDate: " + document.getElementById('date').value + 
          "\\nVentes: " + document.getElementById('ventes').value + " FC" +
          "\\nDépenses: " + document.getElementById('depenses').value + " FC");
}
</script>
</body>
</html>
