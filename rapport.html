<!DOCTYPE html>
<html>
<head>
    <title>Marcher-Direct Rapport</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 30px; background: #f2f2f2; }
        .box { background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 500px; margin: auto; }
        textarea { width: 80%; height: 150px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 12px 25px; background: #25D366; color: white; border: none; border-radius: 5px; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Marcher-Direct</h1>
        <h2>Déposer un Rapport</h2>
        <p>Bienvenue ! Écris ton rapport ici :</p>
        <textarea placeholder="Écris ton rapport du jour..."></textarea>
        <br>
        <button>Envoyer le rapport</button>
        <br><br>
        <a href="index.html">Retour Connexion</a>
    </div>
</body>
</html>
