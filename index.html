<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcher-Direct</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 90%;
      max-width: 400px;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 25px;
      font-size: 24px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }
    .btn1, .btn2, .btn3 {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn1 { background: #667eea; color: white; }
    .btn2 { background: #764ba2; color: white; }
    .btn3 { background: #f0f0f0; color: #333; }
  </style>
</head>
<body>

<div class="box">
  <h1>Bienvenue chez<br>Marcher-Direct</h1>

  <input type="email" placeholder="Votre Email">

  <div style="position: relative;">
    <input type="password" id="passwordField" placeholder="Mot de passe" style="width: 100%; padding-right: 45px;">
    <span id="togglePassword" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 22px;">🙈</span>
  </div>

  <button class="btn1">S'INSCRIRE</button>
  <button class="btn2">SE CONNECTER</button>
  <button class="btn3">J'ai déjà un compte</button> 
</div>

<script>
// BOUTON POUR AFFICHER/CACHER LE MOT DE PASSE
const togglePassword = document.getElementById('togglePassword');
const passwordInput = document.getElementById('passwordField');

togglePassword.addEventListener('click', function () {
  if (passwordInput.type === 'password') {
    passwordInput.type = 'text';
    this.textContent = '🐵'; // Singe qui regarde
  } else {
    passwordInput.type = 'password';
    this.textContent = '🙈'; // Singe qui cache
  }
});
</script>
</body>
</html>
