<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Marcher-Direct</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *{box-sizing:border-box}
    body{text-align:center;font-family:Arial;background:linear-gradient(135deg, #4A90E2, #8E44AD);padding:20px;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .card{background:white;padding:30px 20px;border-radius:20px;max-width:400px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,0.2);}
    .logo{width:120px;height:120px;border-radius:20px;margin:0 auto 20px auto;object-fit:cover;}
    h2{color:#333;margin-bottom:25px;font-size:22px;}
    input{width:100%;padding:14px;margin:10px 0;border-radius:10px;border:1px solid #ddd;font-size:16px;}
    button{width:100%;padding:14px;margin:10px 0;border-radius:10px;border:none;background:#4A90E2;color:white;font-size:16px;font-weight:bold;cursor:pointer;}
    button.signup{background:#8E44AD;}
    button.gray{background:#eee;color:#333;}
  </style>
</head>
<body>
  <div class="card">
    <img src="https://i.ibb.co/twvWjwkF/logo.png" alt="Marcher-Direct Logo" class="logo">
    <h2>Bienvenue chez Marcher-Direct</h2>
    <input type="email" id="email" placeholder="Votre Email" required>
    <input type="password" id="pass" placeholder="Mot de passe" required>
    <button onclick="sInscrire()" class="signup">S'INSCRIRE</button>
    <button onclick="seConnecter()">SE CONNECTER</button>
    <button onclick="seConnecter()" class="gray">J'ai déjà un compte</button>
  </div>

<script>
function allerDansApp(){
  // CE LIEN OUVRE VRAIMENT L'APP
  window.location.href = "app.html"; 
}

function seConnecter(){
  let email = document.getElementById('email').value;
  let pass = document.getElementById('pass').value;
  if(email !== "" && pass !== ""){
    allerDansApp(); 
  } else {
    alert("Veuillez remplir Email et Mot de passe");
  }
}

function sInscrire(){
  alert("Inscription réussie !");
  allerDansApp(); 
}
</script>
</body>
</html>
