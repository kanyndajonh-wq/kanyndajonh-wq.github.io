<!DOCTYPE html>
<html>
<head>
    <title>Marcher-Direct Connexion</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; background: #f2f2f2; }
        .box { background: white; padding: 20px; border-radius: 10px; width: 90%; margin: auto; }
        input { padding: 10px; margin: 10px; width: 80%; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #25D366; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Marcher-Direct</h1>
        <h2>Connexion</h2>
        <input type="email" placeholder="Votre Email">
        <br>
        <input type="password" placeholder="Mot de passe">
        <br>
        <button>Se connecter</button>
    </div>
</body>
</html>
