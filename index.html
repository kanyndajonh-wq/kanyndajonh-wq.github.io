<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcher-Direct</title>
<style>
body{font-family:Arial;background:#25D366;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:white;padding:30px;border-radius:15px;width:90%;max-width:400px;box-shadow:0 4px 10px rgba(0,0,0,0.2);text-align:center}
h1{color:#25D366;font-size:24px}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;margin:10px 0;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer}
.btn1{background:#25D366;color:white}
.btn2{background:white;color:#25D366;border:2px solid #25D366}
</style>
</head>
<body>
<div class="box">
<h1>Bienvenue chez<br>Marcher-Direct</h1>
<input type="email" placeholder="Votre Email">
<input type="password" placeholder="Mot de passe">
<button class="btn1">SE CONNECTER</button>
<button class="btn2">S'INSCRIR</button>
</div>
</body>
</html>
