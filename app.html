<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Marcher-Direct</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
.header{background:linear-gradient(135deg, #4A90E2, #8E44AD);color:white;text-align:center;padding:15px;font-size:22px;font-weight:bold;}
.container{padding:15px;max-width:600px;margin:auto}
.btn{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:none;font-size:16px;font-weight:bold;cursor:pointer;}
.btn-blue{background:#4A90E2;color:white;}
.btn-green{background:#27ae60;color:white;}
.card{background:white;padding:15px;border-radius:15px;margin:15px 0;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
input, textarea{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ddd;font-size:15px;box-sizing:border-box;}
.prod-img{width:100%;height:200px;object-fit:cover;border-radius:10px;}
</style>
</head>
<body>
<div class="header">Marcher-Direct</div>
<div class="container">

<button class="btn btn-blue" onclick="document.getElementById('formulaire').style.display='block'">+ AJOUTER UN PRODUIT</button>
<button class="btn btn-green">🛒 VOIR PANIER (0)</button>

<div class="card" id="formulaire" style="display:none;">
  <h3>Nouveau Produit</h3>
  <input type="text" id="nom" placeholder="Nom du produit">
  <input type="number" id="prix" placeholder="Prix en FC">
  <textarea id="desc" placeholder="Description" rows="3"></textarea>
  <input type="file" id="image" accept="image/*">
  <button class="btn btn-blue" onclick="publierProduit()">PUBLIER</button>
</div>

<h2>Produits disponibles</h2>
<div id="listeProduits"></div>

</div>

<script>
let produits = JSON.parse(localStorage.getItem('produits')) || [];

function afficherProduits(){
  let liste = document.getElementById('listeProduits');
  liste.innerHTML = "";
  produits.forEach((p, i) => {
    liste.innerHTML += `
    <div class="card">
      <img src="${p.image}" class="prod-img">
      <h3>${p.nom}</h3>
      <p><b>Prix: ${p.prix} FC</b></p>
      <p>${p.desc}</p>
      <button class="btn btn-green" onclick="whatsapp('${p.nom}')">Contacter sur WhatsApp</button>
    </div>`;
  });
}

function publierProduit(){
  let nom = document.getElementById('nom').value;
  let prix = document.getElementById('prix').value;
  let desc = document.getElementById('desc').value;
  let file = document.getElementById('image').files[0];

  if(nom=="" || prix==""){ alert("Nom et Prix obligatoires"); return;}

  let reader = new FileReader();
  reader.onload = function(e){
    let newProd = {nom:nom, prix:prix, desc:desc, image:e.target.result};
    produits.push(newProd);
    localStorage.setItem('produits', JSON.stringify(produits));
    afficherProduits();
    document.getElementById('formulaire').style.display='none';
    alert("Produit publié !");
  }
  if(file){ reader.readAsDataURL(file); } else { alert("Choisis une image"); }
}

function whatsapp(nom){
  window.open(`https://wa.me/243853272232?text=Bonjour, je suis intéressé par ${nom} sur Marcher-Direct`);
}

afficherProduits(); // charge les produits au démarrage
</script>
</body>
</html>
