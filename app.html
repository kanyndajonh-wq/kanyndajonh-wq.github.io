<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Marcher-Direct</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:Arial;background:#f5f5f5;}
.header{background:linear-gradient(135deg, #4A90E2, #8E44AD);color:white;text-align:center;padding:15px;font-size:22px;font-weight:bold; position:sticky; top:0; z-index:10;}
.container{padding:15px;}
.btn{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:none;font-size:16px;font-weight:bold;cursor:pointer;color:white;}
.btn-blue{background:#4A90E2;}
.btn-green{background:#25D366;}
.btn-orange{background:#FF9500;width:48%;}
.btn-red{background:#FF3B30;width:48%;}
.btn-purple{background:#833AB4;}

/* LE TRUC POUR SCROLL HORIZONTAL */
.catalogue-scroll{
  display:flex;
  overflow-x:auto;
  scroll-snap-type: x mandatory;
  gap:15px;
  padding:10px 0;
}
.catalogue-scroll::-webkit-scrollbar{ display:none; } /* Cache la barre */

.card{
  background:white;
  border-radius:20px;
  padding:15px;
  min-width:90vw; /* Chaque carte prend 90% de l'écran */
  scroll-snap-align: center;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
  flex-shrink:0;
}
img{width:100%;height:300px; object-fit:cover; border-radius:15px;}
h3{font-size:22px; margin:12px 0 5px 0;}
.prix{font-size:20px; font-weight:bold; margin:5px 0 10px 0;}
.desc{font-size:15px; color:#555; margin-bottom:15px;}
.flex-btn{display:flex; justify-content:space-between;}
input, textarea{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ccc; font-size:16px;}
</style>
</head>
<body>

<div class="header">Marcher-Direct</div>
<div class="container">

<button class="btn btn-blue" onclick="ouvrirForm()">+ AJOUTER UN PRODUIT</button>
<button class="btn btn-green">🛒 VOIR PANIER (0)</button>

<div class="card" id="form" style="display:none;">
<h3 id="titreForm">Ajouter Produit</h3>
<input id="nom" placeholder="Nom du produit">
<input id="prix" placeholder="Prix en FC" type="number">
<textarea id="desc" placeholder="Description" rows="3"></textarea>
<input id="img" type="file" accept="image/*">
<button class="btn btn-blue" id="btnSave" onclick="ajouter()">ENREGISTRER</button>
<button class="btn" style="background:gray;" onclick="fermerForm()">FERMER</button>
</div>

<h2 style="margin:10px 0;">Catalogue - Glisse →</h2>
<div id="liste" class="catalogue-scroll"></div>

</div>

<script>
let produits = JSON.parse(localStorage.getItem('marcherDirectProduits')) || [];
let indexModif = -1;

window.onload = afficher;

function ouvrirForm(){ document.getElementById('form').style.display='block'; }
function fermerForm(){
  document.getElementById('form').style.display='none';
  document.getElementById('titreForm').innerText = "Ajouter Produit";
  document.getElementById('btnSave').innerText = "ENREGISTRER";
  document.getElementById('nom').value = ""; document.getElementById('prix').value = "";
  document.getElementById('desc').value = ""; document.getElementById('img').value = "";
  indexModif = -1;
}

function afficher(){
  let html = "";
  if(produits.length == 0){
    html = "<p style='text-align:center; width:100%;'>Aucun produit. Clique sur + AJOUTER</p>";
  }
  for(let i=0; i<produits.length; i++){
    let p = produits[i];
    html += `
    <div class="card">
      <img src="${p.img}">
      <h3>${p.nom}</h3>
      <p class="prix">Prix: ${p.prix} FC</p>
      <p class="desc">${p.desc}</p>
      <button class="btn btn-green" onclick="whatsapp(${i})">📱 WhatsApp</button>
      <button class="btn btn-purple" onclick="partager(${i})">📤 Partager</button>
      <div class="flex-btn">
        <button class="btn btn-orange" onclick="modifier(${i})">✏️ Modifier</button>
        <button class="btn btn-red" onclick="supprimer(${i})">🗑️ Supprimer</button>
      </div>
    </div>`;
  }
  document.getElementById('liste').innerHTML = html;
}

function sauvegarder(){
  localStorage.setItem('marcherDirectProduits', JSON.stringify(produits));
  afficher();
  fermerForm();
}

function ajouter(){
  let nom = document.getElementById('nom').value;
  let prix = document.getElementById('prix').value;
  let desc = document.getElementById('desc').value;
  let file = document.getElementById('img').files[0];
  
  if(nom=="" || prix==""){alert("Nom et Prix obligatoires"); return;}

  if(indexModif!= -1){
    produits[indexModif].nom = nom; produits[indexModif].prix = prix; produits[indexModif].desc = desc;
    if(file){
      let reader = new FileReader();
      reader.onload = function(e){ produits[indexModif].img = e.target.result; sauvegarder(); alert("Produit modifié!"); }
      reader.readAsDataURL(file);
    } else { sauvegarder(); alert("Produit modifié!"); }
  } else {
    if(!file){alert("Choisis une image"); return;}
    let reader = new FileReader();
    reader.onload = function(e){
      produits.push({nom:nom, prix:prix, desc:desc, img:e.target.result});
      sauvegarder(); alert("Produit ajouté!");
    }
    reader.readAsDataURL(file);
  }
}

function supprimer(i){ if(confirm("Supprimer ce produit?")){ produits.splice(i,1); sauvegarder(); } }
function modifier(i){
  indexModif = i; let p = produits[i]; ouvrirForm();
  document.getElementById('titreForm').innerText = "Modifier Produit";
  document.getElementById('btnSave').innerText = "METTRE À JOUR";
  document.getElementById('nom').value = p.nom; document.getElementById('prix').value = p.prix; document.getElementById('desc').value = p.desc;
}

function whatsapp(i){
  let p = produits[i];
  let numero = "243853272232"; // <-- METS TON NUMÉRO ICI
  let message = `Bonjour! Je suis intéressé par:\n*${p.nom}* - ${p.prix} FC\n${p.desc}`;
  window.open(`https://wa.me/${numero}?text=${encodeURIComponent(message)}`, '_blank');
}

function partager(i){
  let p = produits[i];
  let texte = `🔥 ${p.nom} - ${p.prix} FC 🔥\n${p.desc}`;
  navigator.clipboard.writeText(texte);
  alert("Texte copié! Colle-le sur WhatsApp/FB/IG");
}

</script>
</body>
</html>
