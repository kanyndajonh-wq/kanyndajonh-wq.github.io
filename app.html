<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Marcher-Direct</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
.header{background:linear-gradient(135deg, #4A90E2, #8E44AD);color:white;text-align:center;padding:15px;font-size:22px;font-weight:bold;}
.container{padding:10px;max-width:1000px;margin:auto}
.btn{width:100%;padding:10px;margin:4px 0;border-radius:8px;border:none;font-size:12px;font-weight:bold;cursor:pointer;}
.btn-blue{background:#4A90E2;color:white;}
.btn-green{background:#25D366;color:white;}
.btn-orange{background:#FF9500;color:white;}
.btn-red{background:#FF3B30;color:white;}
.btn-purple{background:#833AB4;color:white;}
.groupe-card{background:white;padding:12px;border-radius:15px;margin:15px 0;box-shadow:0 3px 10px rgba(0,0,0,0.15);}
.groupe-titre{text-align:center; font-weight:bold; color:#8E44AD; margin-bottom:10px;}
.grid-produits{display:grid; grid-template-columns: repeat(2, 1fr); gap:10px;} /* 2 par groupe sur tel */
@media(min-width: 700px){.grid-produits{ grid-template-columns: repeat(4, 1fr); }} /* 4 par groupe sur PC */
.prod-img{width:100%;height:100px;object-fit:cover;border-radius:8px;}
.card h3{font-size:13px; margin:5px 0 2px 0;}
.card p{font-size:12px; margin:2px 0;}
.flex-btn{display:grid; grid-template-columns: 1fr 1fr; gap:5px;}
input, textarea{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ddd;font-size:15px;box-sizing:border-box;}
#popupChoix, #popupPartage{display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; padding:15px; border-radius:15px; box-shadow:0 0 20px rgba(0,0,0,0.3); width:90%; max-width:400px; z-index:100;}
.overlay{display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:99;}
</style>
</head>
<body>
<div class="header">Marcher-Direct</div>
<div class="container">

<button class="btn btn-blue" onclick="document.getElementById('formulaire').style.display='block'">+ AJOUTER UN PRODUIT</button>
<button class="btn btn-green">🛒 VOIR PANIER (0)</button>

<div class="card" id="formulaire" style="display:none;">
  <h3 id="formTitre">Nouveau Produit</h3>
  <input type="text" id="nom" placeholder="Nom du produit">
  <input type="number" id="prix" placeholder="Prix en FC">
  <textarea id="desc" placeholder="Description" rows="3"></textarea>
  <input type="file" id="image" accept="image/*">
  <button class="btn btn-blue" id="btnPublier" onclick="publierProduit()">PUBLIER</button>
  <button class="btn" style="background:gray;color:white;" onclick="annulerForm()">ANNULER</button>
</div>

<h2>Catalogue</h2>
<div id="listeGroupes"></div>

</div>

<div class="overlay" id="overlay" onclick="fermerPopup()"></div>

<!-- POPUP CHOIX PRODUIT DU GROUPE -->
<div id="popupChoix">
  <h3 style="text-align:center;">Choisis un produit 👇</h3>
  <div id="listeChoixProduits"></div>
  <button class="btn" style="background:gray;color:white;" onclick="fermerPopup()">Annuler</button>
</div>

<!-- POPUP PARTAGE -->
<div id="popupPartage">
  <h3 style="text-align:center;">Partager sur :</h3>
  <div id="listePartageProduits"></div>
  <button class="btn" style="background:gray;color:white;" onclick="fermerPopup()">Fermer</button>
</div>

<script>
let produits = JSON.parse(localStorage.getItem('produits')) || [];
let indexEnCours = null;
let groupeEnCours = [];

function afficherProduits(){
  let liste = document.getElementById('listeGroupes');
  liste.innerHTML = "";
  if(produits.length == 0){
    liste.innerHTML = "<p style='text-align:center;'>Aucun produit. Clique sur + AJOUTER</p>";
    return;
  }

  // LOGIQUE DE GROUPAGE : 2 sur tel, 4 sur PC. On prend 2 par défaut
  let tailleGroupe = window.innerWidth < 700? 2 : 4;

  for(let i = 0; i < produits.length; i += tailleGroupe){
    let groupe = produits.slice(i, i + tailleGroupe);
    liste.innerHTML += `
    <div class="groupe-card">
      <div class="groupe-titre">LOT ${Math.floor(i/tailleGroupe) + 1} - ${groupe.length} Produits</div>
      <div class="grid-produits">
        ${groupe.map(p => `
          <div class="card">
            <img src="${p.image}" class="prod-img">
            <h3>${p.nom}</h3>
            <p><b>${p.prix} FC</b></p>
          </div>
        `).join('')}
      </div>
      <button class="btn btn-green" onclick='choisirProduitGroupe(${JSON.stringify(groupe)}, "whatsapp")'>📲 Contacter pour ce Lot</button>
      <button class="btn btn-purple" onclick='choisirProduitGroupe(${JSON.stringify(groupe)}, "partager")'>📤 Partager ce Lot</button>
      <div class="flex-btn">
        <button class="btn btn-orange" onclick='alert("Pour modifier, il faut le faire produit par produit")'>✏️ Gérer Lot</button>
        <button class="btn btn-red" onclick='supprimerGroupe(${i}, ${tailleGroupe})'>🗑️ Supprimer Lot</button>
      </div>
    </div>`;
  }
}

function choisirProduitGroupe(groupe, action){
  groupeEnCours = groupe;
  let div = document.getElementById(action == "whatsapp"? "listeChoixProduits" : "listePartageProduits");
  div.innerHTML = "";
  groupe.forEach((p, i) => {
    div.innerHTML += `
    <div style="display:flex; align-items:center; gap:10px; border-bottom:1px solid #eee; padding:8px 0;">
      <img src="${p.image}" style="width:50px; height:50px; border-radius:8px; object-fit:cover;">
      <div style="flex:1;">
        <b>${p.nom}</b><br>
        <span>${p.prix} FC</span>
      </div>
      <button class="btn btn-green" style="width:auto; padding:8px;" onclick='executerAction(${i}, "${action}")'>Choisir</button>
    </div>`;
  });
  document.getElementById('overlay').style.display = 'block';
  document.getElementById(action == "whatsapp"? "popupChoix" : "popupPartage").style.display = 'block';
}

function executerAction(index, action){
  let p = groupeEnCours[index];
  fermerPopup();
  if(action == "whatsapp") whatsapp(p);
  if(action == "partager") partagerProduit(p);
}

function fermerPopup(){
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('popupChoix').style.display = 'none';
  document.getElementById('popupPartage').style.display = 'none';
}

function supprimerGroupe(startIndex, taille){
  if(confirm("Supprimer tout ce lot de produits?")){
    produits.splice(startIndex, taille);
    localStorage.setItem('produits', JSON.stringify(produits));
    afficherProduits();
  }
}

//... le reste : publierProduit, modifierProduit, whatsapp, partagerProduit sont les mêmes que avant...
function publierProduit(){ /* même code que avant */
  let nom = document.getElementById('nom').value; let prix = document.getElementById('prix').value; let desc = document.getElementById('desc').value; let file = document.getElementById('image').files[0];
  if(nom=="" || prix==""){ alert("Nom et Prix obligatoires"); return;} if(!file && indexEnCours == null){ alert("Choisis une image"); return;}
  if(indexEnCours!= null){ mettreAJourProduit(indexEnCours, nom, prix, desc, file); } else {
    let reader = new FileReader(); reader.onload = function(e){ let newProd = {nom:nom, prix:prix, desc:desc, image:e.target.result}; produits.push(newProd); localStorage.setItem('produits', JSON.stringify(produits)); afficherProduits(); annulerForm(); alert("Produit publié!"); } reader.readAsDataURL(file);
  }
}
function modifierProduit(index){ /*... */ }
function mettreAJourProduit(index, nom, prix, desc, file){ /*... */ }
function annulerForm(){ document.getElementById('formulaire').style.display='none'; document.getElementById('formTitre').innerText = "Nouveau Produit"; document.getElementById('btnPublier').innerText = "PUBLIER"; document.getElementById('nom').value = ""; document.getElementById('prix').value = ""; document.getElementById('desc').value = ""; document.getElementById('image').value = ""; indexEnCours = null; }

function whatsapp(produit){
  let numero = "243853272232"; // <-- MET TON NUMÉRO ICI
  let message = `Bonjour! 👋\n\nJe suis intéressé par :\n*${produit.nom}* - ${produit.prix} FC\n${produit.desc}\n\n_Envoyé depuis Marcher-Direct_`;
  window.open(`https://wa.me/${numero}?text=${encodeURIComponent(message)}`, '_blank');
}
function partagerProduit(p){
  let texte = `🔥 ${p.nom} - ${p.prix} FC 🔥\n${p.desc}`;
  window.open(`https://wa.me/?text=${encodeURIComponent(texte)}`, '_blank');
}

afficherProduits();
</script>
</body>
</html>
