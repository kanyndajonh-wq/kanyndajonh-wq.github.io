<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Marcher-Direct</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;}
body{font-family:Arial;background:#f5f5f5;margin:0}
.header{background:linear-gradient(135deg, #4A90E2, #8E44AD);color:white;text-align:center;padding:15px;font-size:22px;font-weight:bold;}
.container{padding:10px;max-width:600px;margin:auto}
.btn{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;font-size:14px;font-weight:bold;cursor:pointer;}
.btn-blue{background:#4A90E2;color:white;}
.btn-green{background:#25D366;color:white;}
.btn-orange{background:#FF9500;color:white;}
.btn-red{background:#FF3B30;color:white;}
.btn-purple{background:#833AB4;color:white;}
.card{background:white;padding:15px;border-radius:15px;margin:15px 0;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
input, textarea{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ddd;font-size:15px;}
.prod-img{width:100%;height:250px;object-fit:cover;border-radius:10px;} /* Image plus grande en vertical */
.card h3{font-size:18px; margin:10px 0 5px 0;}
.card p{font-size:15px; margin:5px 0;}
.flex-btn{display:flex; gap:10px;}
.flex-btn.btn{width:50%;}
</style>
</head>
<body>
<div class="header">Marcher-Direct</div>
<div class="container">

<button class="btn btn-blue" onclick="ouvrirForm()">+ AJOUTER UN PRODUIT</button>
<button class="btn btn-green" onclick="alert('Le panier arrive à la prochaine étape')">🛒 VOIR PANIER (0)</button>

<div class="card" id="formulaire" style="display:none;">
  <h3 id="formTitre">Nouveau Produit</h3>
  <input type="text" id="nom" placeholder="Nom du produit">
  <input type="number" id="prix" placeholder="Prix en FC">
  <textarea id="desc" placeholder="Description" rows="3"></textarea>
  <input type="file" id="image" accept="image/*">
  <button class="btn btn-blue" id="btnPublier" onclick="publierProduit()">PUBLIER</button>
  <button class="btn" style="background:gray;color:white;" onclick="fermerForm()">ANNULER</button>
</div>

<h2>Catalogue</h2>
<div id="listeProduits"></div> <!-- PLUS DE GRID ICI = VERTICAL -->

</div>

<script>
let produits = JSON.parse(localStorage.getItem('produitsMD')) || [];
let indexModif = null;

function afficherProduits(){
  let liste = document.getElementById('listeProduits');
  liste.innerHTML = "";
  if(produits.length == 0){
    liste.innerHTML = "<p style='text-align:center;'>Aucun produit. Clique sur + AJOUTER</p>";
    return;
  }
  produits.forEach((p, i) => {
    liste.innerHTML += `
    <div class="card">
      <img src="${p.image}" class="prod-img">
      <h3>${p.nom}</h3>
      <p><b>Prix: ${p.prix} FC</b></p>
      <p>${p.desc}</p>

      <button class="btn btn-green" onclick='envoyerWhatsApp(${i})'>📲 Contacter sur WhatsApp</button>
      <button class="btn btn-purple" onclick='partagerProduit(${i})'>📤 Partager</button>

      <div class="flex-btn">
        <button class="btn btn-orange" onclick='modifierProduit(${i})'>✏️ Modifier</button>
        <button class="btn btn-red" onclick='supprimerProduit(${i})'>🗑️ Supprimer</button>
      </div>
    </div>`;
  });
}

function ouvrirForm(){ document.getElementById('formulaire').style.display='block'; }
function fermerForm(){
  document.getElementById('formulaire').style.display='none';
  document.getElementById('formTitre').innerText = "Nouveau Produit";
  document.getElementById('btnPublier').innerText = "PUBLIER";
  document.getElementById('nom').value = ""; document.getElementById('prix').value = "";
  document.getElementById('desc').value = ""; document.getElementById('image').value = "";
  indexModif = null;
}

function publierProduit(){
  let nom = document.getElementById('nom').value; let prix = document.getElementById('prix').value;
  let desc = document.getElementById('desc').value; let file = document.getElementById('image').files[0];
  if(nom=="" || prix==""){ alert("Nom et Prix obligatoires"); return;}

  if(indexModif!= null){
    produits[indexModif].nom = nom; produits[indexModif].prix = prix; produits[indexModif].desc = desc;
    if(file){ let reader = new FileReader(); reader.onload = function(e){ produits[indexModif].image = e.target.result; sauvegarder(); } reader.readAsDataURL(file);
    } else { sauvegarder(); }
  } else {
    if(!file){ alert("Choisis une image"); return;}
    let reader = new FileReader(); reader.onload = function(e){
      let newProd = {nom:nom, prix:prix, desc:desc, image:e.target.result};
      produits.push(newProd); sauvegarder();
    } reader.readAsDataURL(file);
  }
}

function sauvegarder(){
  localStorage.setItem('produitsMD', JSON.stringify(produits));
  afficherProduits(); fermerForm();
  alert(indexModif!= null? "Produit modifié!" : "Produit publié!");
}

function supprimerProduit(index){
  if(confirm("Supprimer ce produit?")){ produits.splice(index, 1); sauvegarder(); }
}

function modifierProduit(index){
  indexModif = index; let p = produits[index]; ouvrirForm();
  document.getElementById('formTitre').innerText = "Modifier Produit";
  document.getElementById('nom').value = p.nom; document.getElementById('prix').value = p.prix;
  document.getElementById('desc').value = p.desc; document.getElementById('btnPublier').innerText = "METTRE À JOUR";
}

function envoyerWhatsApp(index){
  let p = produits[index];
  let numero = "243853272232"; // <-- METS TON NUMÉRO ICI SANS +
  let message = `Bonjour! 👋\n\nJe suis intéressé par :\n*${p.nom}* - ${p.prix} FC\n${p.desc}\n\n_Envoyé depuis Marcher-Direct_`;
  window.open(`https://wa.me/${numero}?text=${encodeURIComponent(message)}`, '_blank');
}

function partagerProduit(index){
  let p = produits[index];
  let texte = `🔥 ${p.nom} - ${p.prix} FC 🔥\n${p.desc}\n\nVoir sur Marcher-Direct`;
  let choix = confirm("OK = Partager sur WhatsApp\nAnnuler = Copier le texte pour FB/IG");
  if(choix){ window.open(`https://wa.me/?text=${encodeURIComponent(texte)}`, '_blank');
  } else { navigator.clipboard.writeText(texte); alert("Texte copié!"); }
}

afficherProduits();
</script>
</body>
</html>
